[workspace]
members = [
    "crates/nanocode",
    "crates/runtime/agent",
    "crates/runtime/agent-config",
    "crates/core/agent",
    "crates/core/agent-types",
    "crates/core/durability",
    "crates/core/turnlog",
    "crates/core/types-core",
    "crates/core/unicode-normalization",
    "crates/core/process",
    "crates/integrations/agent-host",
    "crates/runtime/tool-host",
    "crates/runtime/code-mode",
    "crates/runtime/code-mode-engine",
    "crates/runtime/durability",
    "crates/runtime/subagents",
    "crates/backends/claude",
    "crates/backends/claude/client",
    "crates/backends/claude/tools",
    "crates/backends/codex",
    "crates/backends/codex/client",
    "crates/core/home",
    "crates/core/http",
    "crates/core/zstd",
    "crates/core/digest",
    "crates/core/url",
    "crates/core/arguments",
    "crates/core/webp",
    "crates/core/compression",
    "crates/core/jpeg",
    "crates/core/tempo",
    "crates/core/mcp",
    "crates/core/mcp-http",
    "crates/core/platform",
    "crates/core/numeric",
    "crates/core/flags",
    "crates/core/python",
    "crates/core/schema",
    "crates/core/shell",
    "crates/core/tool-provider",
    "crates/core/image",
    "crates/core/png",
    "crates/core/gif",
    "crates/core/audio",
    "crates/core/tls",
    "crates/core/x509",
    "crates/core/websocket",
    "crates/core/machine",
    "crates/core/sync",
    "crates/core/sys",
    "crates/core/tools",
    "crates/core/tool-contracts",
    "crates/core/tools-macros",
    "crates/core/types",
    "crates/integrations/tool-runtime",
    "crates/integrations/process",
    "crates/integrations/psh",
    "crates/integrations/psh-embedded",
    "crates/integrations/mcp-tools",
    "crates/integrations/computer",
    "crates/integrations/computer-repl",
    "crates/integrations/chatgpt-extension",
    "crates/integrations/sandbox",
    "crates/integrations/observability",
    "crates/integrations/telemetry",
    "crates/integrations/store-sql",
    "crates/integrations/store-jsonl",
    "crates/tui",
    "bin/nanocode",
    "bin/cua-driver",
    "bin/nc-lite",
    "bin/nanocode-sim",
]
default-members = ["crates/nanocode"]
exclude = ["crates/patches"]
resolver = "2"

[workspace.package]
version = "0.7.0"
edition = "2024"
rust-version = "1.97"
authors = ["Nanocode Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/nanocodexyz/nanocode"
keywords = ["ai", "agents", "openai", "sdk", "websocket"]
categories = ["api-bindings", "asynchronous", "development-tools"]
publish = true

[workspace.dependencies]
nanocode-backend-claude-tools = { version = "0.7.0", path = "crates/backends/claude/tools" }
nanocode-agent-types = { version = "0.7.0", path = "crates/core/agent-types" }
nanocode-durability-core = { version = "0.7.0", path = "crates/core/durability" }
nanocode-turnlog = { version = "0.7.0", path = "crates/core/turnlog" }
nanocode-types-core = { version = "0.7.0", path = "crates/core/types-core" }
nanocode-agent-config = { version = "0.7.0", path = "crates/runtime/agent-config" }
nanocode-process-contracts = { version = "0.7.0", path = "crates/core/process" }
nanocode-agent = { version = "0.7.0", path = "crates/runtime/agent" }
nanocode-agent-host = { version = "0.7.0", path = "crates/integrations/agent-host" }
nanocode-backend-codex = { version = "0.7.0", path = "crates/backends/codex" }
nanocode-backend-codex-client = { version = "0.7.0", path = "crates/backends/codex/client" }
nanocode-agent-core = { version = "0.7.0", path = "crates/core/agent" }
nanocode-tool-host = { version = "0.7.0", path = "crates/runtime/tool-host" }
nanocode-image = { version = "0.7.0", path = "crates/core/image" }
nanocode-audio = { version = "0.7.0", path = "crates/core/audio" }
nanocode-tls = { version = "0.7.0", path = "crates/core/tls" }
nanocode-websocket = { version = "0.7.0", path = "crates/core/websocket" }
nanocode-types = { version = "0.7.0", path = "crates/core/types" }
nanocode-computer = { version = "0.7.0", path = "crates/integrations/computer" }
nanocode-computer-repl = { version = "0.7.0", path = "crates/integrations/computer-repl" }
nanocode-tools = { version = "0.7.0", path = "crates/core/tools" }
nanocode-tool-contracts = { version = "0.7.0", path = "crates/core/tool-contracts" }
nanocode-store-jsonl = { version = "0.7.0", path = "crates/integrations/store-jsonl" }
libc = "0.2"
memchr = "2.8.3"
mimalloc = { version = "0.1.52", default-features = false }
futures-util = { version = "0.3.31", default-features = false, features = ["async-await", "sink", "std"] }
bytes = "1.12.1"
http = "1.3.1"
httparse = "1.10.1"
nanocode-backend-claude = { version = "0.7.0", path = "crates/backends/claude" }
nanocode-backend-claude-client = { version = "0.7.0", path = "crates/backends/claude/client" }
nanocode-arguments = { version = "0.7.0", path = "crates/core/arguments" }
nanocode-home = { version = "0.7.0", path = "crates/core/home" }
nanocode-http = { version = "0.7.0", path = "crates/core/http" }
nanocode-mcp = { version = "0.7.0", path = "crates/core/mcp" }
nanocode-mcp-http = { version = "0.7.0", path = "crates/core/mcp-http" }
nanocode-platform = { version = "0.7.0", path = "crates/core/platform" }
nanocode-python = { version = "0.7.0", path = "crates/core/python" }
nanocode-machine = { version = "0.7.0", path = "crates/core/machine" }
nanocode-sync = { version = "0.7.0", path = "crates/core/sync" }
nanocode-sys = { version = "0.7.0", path = "crates/core/sys" }
nanocode-flags = { version = "0.7.0", path = "crates/core/flags" }
nanocode-tempo = { version = "0.7.0", path = "crates/core/tempo" }
nanocode-schema = { version = "0.7.0", path = "crates/core/schema" }
nanocode-shell = { version = "0.7.0", path = "crates/core/shell" }
nanocode-durability = { version = "0.7.0", path = "crates/runtime/durability" }
nanocode-subagents = { version = "0.7.0", path = "crates/runtime/subagents" }
nanocode-code-mode = { version = "0.7.0", path = "crates/runtime/code-mode"  }
nanocode-tool-runtime = { version = "0.7.0", path = "crates/integrations/tool-runtime" }
nanocode-tool-provider = { version = "0.7.0", path = "crates/core/tool-provider" }
nanocode-process = { version = "0.7.0", path = "crates/integrations/process" }
nanocode-psh = { version = "0.7.0", path = "crates/integrations/psh" }
nanocode-psh-embedded = { version = "0.7.0", path = "crates/integrations/psh-embedded" }
psh = { path = "crates/patches/psh/crates/psh" }
psh-classify = { path = "crates/patches/psh/crates/psh-classify" }
psh-syntax = { path = "crates/patches/psh/crates/psh-syntax" }
nanocode-mcp-tools = { version = "0.7.0", path = "crates/integrations/mcp-tools" }
nanocode-code-mode-engine = { version = "0.7.0", path = "crates/runtime/code-mode-engine" }
nanocode-tools-macros = { version = "0.7.0", path = "crates/core/tools-macros" }
proc-macro2 = "1.0.106"
quote = "1.0.46"
graviola = "0.4.1"
rustls = { version = "0.23.45", default-features = false, features = ["std"] }
rustls-graviola = "0.4.0"
djs-embed = { path = "crates/patches/djs/crates/djs-embed" }
psh-engine = { path = "crates/patches/psh/crates/psh-engine" }
psh-utils = { path = "crates/patches/psh/crates/psh-utils" }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = { version = "1.0.149", features = ["float_roundtrip", "raw_value"] }
syn = { version = "2.0.119", features = ["full"] }
tokio = "1.48.0"
tokio-rustls = { version = "0.26.4", default-features = false }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-core = { version = "0.1.36", default-features = false, features = ["std"] }
unicode-normalization = { path = "crates/core/unicode-normalization" }
nanocode-url = { version = "0.7.0", path = "crates/core/url" }
nanocode-zstd = { version = "0.7.0", path = "crates/core/zstd" }
nanocode-digest = { version = "0.7.0", path = "crates/core/digest" }
nanocode-x509 = { version = "0.7.0", path = "crates/core/x509" }
nanocode-compression = { version = "0.7.0", path = "crates/core/compression" }
nanocode-png = { version = "0.7.0", path = "crates/core/png" }
nanocode-gif = { version = "0.7.0", path = "crates/core/gif" }
nanocode-jpeg = { version = "0.7.0", path = "crates/core/jpeg" }
nanocode-webp = { version = "0.7.0", path = "crates/core/webp" }
ruff_python_ast = { package = "rustpython-ruff_python_ast", version = "=0.16.5" }
ruff_python_parser = { package = "rustpython-ruff_python_parser", version = "=0.16.5" }
rustpython-pylib = { version = "=0.6.0", features = ["freeze-stdlib"] }
rustpython-stdlib = { version = "=0.6.0", default-features = false, features = ["compiler"] }
rustpython-vm = { version = "=0.6.0", default-features = false, features = ["compiler", "gc", "freeze-stdlib"] }

[patch.crates-io]
rustls-platform-verifier = { path = "crates/patches/rustls-platform-verifier" }
rustls-webpki = { path = "crates/patches/rustls-webpki" }
pymath = { path = "crates/patches/pymath" }
rustpython-codegen = { path = "crates/patches/rustpython-codegen" }
rustpython-common = { path = "crates/patches/rustpython-common" }
rustpython-compiler = { path = "crates/patches/rustpython-compiler" }
rustpython-compiler-core = { path = "crates/patches/rustpython-compiler-core" }
rustpython-derive = { path = "crates/patches/rustpython-derive" }
rustpython-derive-impl = { path = "crates/patches/rustpython-derive-impl" }
rustpython-doc = { path = "crates/patches/rustpython-doc" }
rustpython-host_env = { path = "crates/patches/rustpython-host_env" }
rustpython-literal = { path = "crates/patches/rustpython-literal" }
rustpython-pylib = { path = "crates/patches/rustpython-pylib" }
rustpython-ruff_python_ast = { path = "crates/patches/rustpython-ruff_python_ast" }
rustpython-ruff_python_parser = { path = "crates/patches/rustpython-ruff_python_parser" }
rustpython-ruff_python_trivia = { path = "crates/patches/rustpython-ruff_python_trivia" }
rustpython-ruff_source_file = { path = "crates/patches/rustpython-ruff_source_file" }
rustpython-ruff_text_size = { path = "crates/patches/rustpython-ruff_text_size" }
rustpython-sre_engine = { path = "crates/patches/rustpython-sre_engine" }
rustpython-stdlib = { path = "crates/patches/rustpython-stdlib" }
rustpython-unicode = { path = "crates/patches/rustpython-unicode" }
rustpython-vm = { path = "crates/patches/rustpython-vm" }
rustpython-wtf8 = { path = "crates/patches/rustpython-wtf8" }
unicode-normalization = { path = "crates/core/unicode-normalization" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
missing_const_for_fn = "warn"
use_self = "warn"
redundant_clone = "warn"
large_enum_variant = "allow"
result_large_err = "allow"
double_must_use = "allow"

[profile.dev]
debug = false
split-debuginfo = "unpacked"
strip = false

[profile.dev.package."*"]
debug = false

[profile.ci]
inherits = "dev"
incremental = false

[profile.release]
opt-level = 3
lto = "off"
debug = "none"
strip = "symbols"
panic = "unwind"
codegen-units = 16

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.lite]
inherits = "dist"
opt-level = "z"

[profile.profiling]
inherits = "release"
debug = "full"
strip = false

[profile.bench]
inherits = "profiling"

[profile.wasm]
inherits = "release"
lto = "off"
opt-level = "z"
panic = "abort"
strip = "symbols"
