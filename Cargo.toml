[workspace]
members = [
    "crates/nanocode",
    "crates/runtime/agent",
    "crates/runtime/agent-config",
    "crates/core/agent",
    "crates/core/agent-types",
    "crates/core/durability",
    "crates/core/types-core",
    "crates/core/process",
    "crates/integrations/agent-host",
    "crates/runtime/tool-host",
    "crates/runtime/code-mode",
    "crates/runtime/code-mode-engine",
    "crates/runtime/durability",
    "crates/runtime/subagents",
    "crates/backends/claude",
    "crates/backends/claude/client",
    "crates/backends/claude/tools",
    "crates/backends/codex",
    "crates/backends/codex/client",
    "crates/core/home",
    "crates/core/http",
    "crates/core/zstd",
    "crates/core/mcp",
    "crates/core/mcp-http",
    "crates/core/platform",
    "crates/core/schema",
    "crates/core/media",
    "crates/core/tool-provider",
    "crates/core/image",
    "crates/core/audio",
    "crates/core/tls",
    "crates/core/sync",
    "crates/core/tools",
    "crates/core/tool-contracts",
    "crates/core/tools-macros",
    "crates/core/types",
    "crates/integrations/tool-runtime",
    "crates/integrations/process",
    "crates/integrations/mcp-tools",
    "crates/integrations/cua",
    "crates/integrations/cua-tools",
    "crates/integrations/chatgpt-extension",
    "crates/integrations/sandbox",
    "crates/integrations/decisions",
    "crates/integrations/observability",
    "crates/integrations/store-postgres",
    "crates/integrations/store-sqlx",
    "crates/integrations/store-sqlite",
    "crates/integrations/store-jsonl",
    "crates/tui",
    "bin/nanocode",
    "bin/cua-driver",
]
default-members = ["crates/nanocode"]
exclude = ["crates/patches"]
resolver = "2"

[workspace.package]
version = "0.6.7"
edition = "2024"
rust-version = "1.97"
authors = ["Nanocode Contributors"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/gakonst/nanocode"
repository = "https://github.com/gakonst/nanocode"
keywords = ["ai", "agents", "openai", "sdk", "websocket"]
categories = ["api-bindings", "asynchronous", "development-tools"]
publish = true

[workspace.dependencies]
cua-driver-core = { git = "https://github.com/gakonst/cua", rev = "432c76d48d59757fe95ff2fcb19cf1d49c4aac92", default-features = false }
cua-driver-sdk = { git = "https://github.com/gakonst/cua", rev = "432c76d48d59757fe95ff2fcb19cf1d49c4aac92" }
cursor-overlay = { git = "https://github.com/gakonst/cua", rev = "432c76d48d59757fe95ff2fcb19cf1d49c4aac92" }
nanocode-backend-claude-tools = { version = "0.6.7", path = "crates/backends/claude/tools" }
nanocode-agent-types = { version = "0.6.7", path = "crates/core/agent-types" }
nanocode-durability-core = { version = "0.6.7", path = "crates/core/durability" }
nanocode-types-core = { version = "0.6.7", path = "crates/core/types-core" }
nanocode-agent-config = { version = "0.6.7", path = "crates/runtime/agent-config" }
nanocode-process-contracts = { version = "0.6.7", path = "crates/core/process" }
nanocode-agent = { version = "0.6.7", path = "crates/runtime/agent" }
nanocode-agent-host = { version = "0.6.7", path = "crates/integrations/agent-host" }
nanocode-backend-codex = { version = "0.6.7", path = "crates/backends/codex" }
nanocode-backend-codex-client = { version = "0.6.7", path = "crates/backends/codex/client" }
nanocode-agent-core = { version = "0.6.7", path = "crates/core/agent" }
nanocode-tool-host = { version = "0.6.7", path = "crates/runtime/tool-host" }
nanocode-media = { version = "0.6.7", path = "crates/core/media" }
nanocode-image = { version = "0.6.7", path = "crates/core/image" }
nanocode-audio = { version = "0.6.7", path = "crates/core/audio" }
nanocode-tls = { version = "0.6.7", path = "crates/core/tls" }
nanocode-types = { version = "0.6.7", path = "crates/core/types" }
nanocode-cua = { version = "0.6.7", path = "crates/integrations/cua" }
nanocode-cua-tools = { version = "0.6.7", path = "crates/integrations/cua-tools" }
nanocode-chatgpt-extension = { version = "0.6.7", path = "crates/integrations/chatgpt-extension" }
nanocode-sandbox = { version = "0.6.7", path = "crates/integrations/sandbox" }
nanocode-decisions = { version = "0.6.7", path = "crates/integrations/decisions" }
nanocode-tools = { version = "0.6.7", path = "crates/core/tools" }
nanocode-tool-contracts = { version = "0.6.7", path = "crates/core/tool-contracts" }
nanocode-store-jsonl = { version = "0.6.7", path = "crates/integrations/store-jsonl" }
nanocode-store-sqlite = { version = "0.6.7", path = "crates/integrations/store-sqlite" }
nanocode-store-postgres = { version = "0.6.7", path = "crates/integrations/store-postgres" }
nanocode-store-sqlx = { version = "0.6.7", path = "crates/integrations/store-sqlx" }
landlock = "0.4.4"
libc = "0.2"
base64 = "0.22.1"
base64-simd = "0.8.0"
memchr = "2.8.3"
wide = "1.7.1"
brotli-decompressor = "5.0.3"
flate2 = "1.1.9"
zstd = { version = "0.14.3", default-features = false }
arc-swap = "1.9.2"
crossbeam-utils = { version = "0.8.22", default-features = false, features = ["std"] }
sync_wrapper = "1.0.2"
async-trait = "=0.1.89"
axum = { version = "0.8.9", default-features = false, features = ["form", "http1", "json", "query", "tokio"] }
chrono = { version = "0.4.43", default-features = false, features = ["std"] }
clap = { version = "4.5.54", features = ["derive", "env"] }
eyre = "0.6.12"
futures-channel = "0.3.31"
futures-util = { version = "0.3.31", default-features = false, features = ["async-await", "sink", "std"] }
roxmltree = "0.21.1"
getrandom = "0.4.3"
http = "1.3.1"
httpdate = "1.0.3"
ignore = "0.4.31"
nanocode = { version = "0.6.7", path = "crates/nanocode" }
nanocode-backend-claude = { version = "0.6.7", path = "crates/backends/claude" }
nanocode-backend-claude-client = { version = "0.6.7", path = "crates/backends/claude/client" }
nanocode-home = { version = "0.6.7", path = "crates/core/home" }
nanocode-http = { version = "0.6.7", path = "crates/core/http" }
nanocode-mcp = { version = "0.6.7", path = "crates/core/mcp" }
nanocode-mcp-http = { version = "0.6.7", path = "crates/core/mcp-http" }
nanocode-platform = { version = "0.6.7", path = "crates/core/platform" }
nanocode-sync = { version = "0.6.7", path = "crates/core/sync" }
nanocode-schema = { version = "0.6.7", path = "crates/core/schema" }
nanocode-durability = { version = "0.6.7", path = "crates/runtime/durability" }
nanocode-observability = { version = "0.6.7", path = "crates/integrations/observability" }
nanocode-subagents = { version = "0.6.7", path = "crates/runtime/subagents" }
nanocode-code-mode = { version = "0.6.7", path = "crates/runtime/code-mode"  }
nanocode-tool-runtime = { version = "0.6.7", path = "crates/integrations/tool-runtime" }
nanocode-tool-provider = { version = "0.6.7", path = "crates/core/tool-provider" }
nanocode-process = { version = "0.6.7", path = "crates/integrations/process" }
nanocode-mcp-tools = { version = "0.6.7", path = "crates/integrations/mcp-tools" }
nanocode-code-mode-engine = { version = "0.6.7", path = "crates/runtime/code-mode-engine" }
nanocode-tools-macros = { version = "0.6.7", path = "crates/core/tools-macros" }
image = { version = "=0.25.6", default-features = false, features = ["bmp", "gif", "jpeg", "png", "pnm", "webp"] }
iana-time-zone = "0.1.64"
nix = { version = "0.31.3", default-features = false, features = ["process", "resource", "signal", "socket", "user"] }
portable-pty = "0.9.0"
opentelemetry = { version = "0.32", default-features = false, features = ["metrics", "trace"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "metrics", "reqwest-blocking-client", "trace"] }
opentelemetry-proto = { version = "0.32", default-features = false, features = ["gen-tonic-messages", "metrics", "trace", "with-serde"] }
opentelemetry-semantic-conventions = "0.32"
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["metrics", "trace"] }
proc-macro-crate = "3"
proc-macro2 = "1.0.106"
quote = "1.0.46"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls-no-provider"] }
rustix = { version = "1.1.4", features = ["thread"] }
rustls-native-certs = "0.8.4"
rustls = { version = "0.23.45", default-features = false, features = ["std"] }
regex = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
tokio-postgres = "0.7"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio"] }
rquickjs = "0.14.0"
schemars = "0.8.22"
seccompiler = "0.5.0"
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = { version = "1.0.149", features = ["raw_value"] }
sha1 = "0.11.0"
sha2 = { version = "0.11.0", default-features = false }
blake3 = { version = "1.8.7", default-features = false }
simd-json = "=0.15.1"
smallvec = { version = "1.15.1", features = ["serde"] }
sonic-rs = "0.5.8"
syn = { version = "2.0.119", features = ["full"] }
thiserror = "2.0.17"
tempfile = "3.27.0"
tokio = "1.48.0"
tokio-util = { version = "0.7", features = ["codec"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "__rustls-tls"] }
tokio-rustls = { version = "0.26.4", default-features = false }
tower = { version = "0.5.2", features = ["retry", "util"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-appender = "0.2.4"
tracing-opentelemetry = { version = "0.33", default-features = false, features = ["metrics"] }
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "json"] }
url = "2.5.7"
uuid = { version = "1", features = ["serde", "v5"] }
nanocode-zstd = { version = "0.6.7", path = "crates/core/zstd" }

[patch.crates-io]
iana-time-zone = { path = "crates/patches/iana-time-zone" }
rustls-platform-verifier = { path = "crates/patches/rustls-platform-verifier" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
missing_const_for_fn = "warn"
use_self = "warn"
redundant_clone = "warn"
large_enum_variant = "allow"
result_large_err = "allow"

[profile.dev]
debug = false
split-debuginfo = "unpacked"
strip = false

[profile.dev.package."*"]
debug = false

[profile.dev.package.ratatui-widgets]
opt-level = 2

[profile.dev.package."sha2:0.11.0"]
opt-level = 3

[profile.ci]
inherits = "dev"
incremental = false

[profile.release]
opt-level = 3
lto = "off"
debug = "none"
strip = "symbols"
panic = "unwind"
codegen-units = 16

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.profiling]
inherits = "release"
debug = "full"
strip = false

[profile.bench]
inherits = "profiling"

[profile.wasm]
inherits = "release"
lto = "off"
opt-level = "z"
panic = "abort"
strip = "symbols"
