[package]
name = "nanocode-cua-driver"
autotests = false
autobenches = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
repository.workspace = true
description = "The cua-driver built into nanocode, as its own executable"

[[bin]]
name = "nanocode-cua-driver"
path = "src/main.rs"
test = false
bench = false

[target.'cfg(target_os = "macos")'.dependencies]
nanocode-computer = { path = "../../crates/integrations/computer", version = "0.7.0" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
