[package]
name = "nanocode-sim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Deterministic simulator for nanocode's durability stores"
autotests = false
autobenches = false

[[bin]]
name = "nanocode-sim"
path = "src/main.rs"
test = false
bench = false

[dependencies]
futures-util.workspace = true
nanocode-agent-core.workspace = true
nanocode-durability-core.workspace = true
nanocode-durability.workspace = true
nanocode-platform.workspace = true
nanocode-subagents.workspace = true
nanocode-sync.workspace = true
nanocode-turnlog.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "macros"] }

[lints]
workspace = true
