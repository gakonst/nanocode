[package]
name = "nanocode-cli"
autotests = false
autobenches = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
authors = ["Nanocode Contributors", "Ben Clabby"]
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
description = "Interactive terminal coding agent built on the Nanocode Rust crates"

[lib]
name = "nanocode_cli"
path = "src/lib.rs"
test = false
bench = false
doctest = false

[[bin]]
name = "nanocode"
path = "src/main.rs"
test = false
bench = false

[target.'cfg(not(target_family = "wasm"))'.dependencies]
clap.workspace = true
futures-util.workspace = true
nanocode = { path = "../../crates/nanocode", version = "0.6.7" }
nanocode-home = { path = "../../crates/core/home", version = "0.6.7" }
nanocode-observability = { path = "../../crates/integrations/observability", version = "0.6.7" }
nanocode-store-jsonl = { path = "../../crates/integrations/store-jsonl", version = "0.6.7" }
nanocode-sync.workspace = true
nanocode-tui = { path = "../../crates/tui", version = "0.6.7" }
opentelemetry.workspace = true
serde_json.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing.workspace = true
tracing-opentelemetry.workspace = true
uuid = { workspace = true, features = ["v7"] }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["time"] }

[lints]
workspace = true
