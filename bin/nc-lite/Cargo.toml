[package]
name = "nc-lite"
autotests = false
autobenches = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
repository.workspace = true
description = "nanocode cut down to what fx ships: one harness, plain tools, a JSONL store and an inline terminal interface"

[[bin]]
name = "nc-lite"
path = "src/main.rs"
test = false
bench = false

[target.'cfg(not(target_family = "wasm"))'.dependencies]
nanocode-agent.workspace = true
nanocode-agent-host.workspace = true
nanocode-backend-codex.workspace = true
nanocode-durability.workspace = true
nanocode-store-jsonl.workspace = true
nanocode-tool-runtime.workspace = true
nanocode-tui = { path = "../../crates/tui", version = "0.7.0" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
nanocode-home.workspace = true
nanocode-psh.workspace = true
nanocode-psh-embedded.workspace = true
psh.workspace = true

[lints]
workspace = true
