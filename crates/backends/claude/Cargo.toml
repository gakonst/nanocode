[package]
autotests = false
autobenches = false
name = "nanocode-backend-claude"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Claude backend: agent driver, prompts, tools and durability over the Messages client"

[dependencies]
nanocode-backend-claude-tools.workspace = true
nanocode-backend-claude-client.workspace = true
nanocode-http.workspace = true
nanocode-process-contracts.workspace = true
nanocode-agent-config.workspace = true
nanocode-sys.workspace = true
nanocode-tool-contracts.workspace = true
nanocode-tool-host.workspace = true
nanocode-platform.workspace = true
nanocode-agent-core.workspace = true
nanocode-durability.workspace = true
nanocode-sync.workspace = true
nanocode-types.workspace = true
nanocode-tools.workspace = true
nanocode-image.workspace = true
nanocode-home = { workspace = true  }
nanocode-url.workspace = true
futures-util.workspace = true
nanocode-code-mode = { path = "../../runtime/code-mode", version = "0.7.0"   }
tokio = { workspace = true, features = ["macros", "sync", "time"] }
http.workspace = true
serde.workspace = true
serde_json.workspace = true
nanocode-trace.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
nanocode-process.workspace = true
tokio = { workspace = true, features = ["fs"] }

[lints]
workspace = true

[lib]
test = false
doctest = false
bench = false
