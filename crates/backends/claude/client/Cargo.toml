serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
reqwest = { workspace = true, features = ["stream", "gzip", "deflate"] }
bytes = "1.9"
