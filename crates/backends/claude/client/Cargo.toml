[package]
autotests = false
autobenches = false
name = "nanocode-backend-claude-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Typed Anthropic Messages protocol, authentication and streaming transport"

[dependencies]
arc-swap.workspace = true
nanocode-sync.workspace = true
blake3.workspace = true
memchr.workspace = true
nanocode-agent-types.workspace = true
nanocode-platform.workspace = true
nanocode-home.workspace = true
base64.workspace = true
sha2.workspace = true
xxhash-rust = { version = "0.8.15", features = ["xxh64"] }
url.workspace = true
futures-util.workspace = true
httpdate = "1.0.3"
nanocode-http.workspace = true
tokio = { workspace = true, features = ["macros", "sync", "time"] }
uuid.workspace = true
http.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
reqwest = { workspace = true, features = ["stream", "gzip", "deflate"] }
bytes = "1.9"
tokio = { workspace = true, features = ["fs", "io-util", "net", "process", "rt-multi-thread"] }
nanocode-tls.workspace = true
unicode-normalization = "0.1.25"

[lints]
workspace = true

[lib]
test = false
doctest = false
bench = false
