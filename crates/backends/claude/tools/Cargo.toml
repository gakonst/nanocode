[package]
name = "nanocode-backend-claude-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
autotests = false
autobenches = false
description = "Claude tool definitions and handlers independent of the Messages client and agent driver"

[dependencies]
nanocode-home.workspace = true
nanocode-platform.workspace = true
nanocode-sync.workspace = true
nanocode-tools.workspace = true
schemars.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
nanocode-image.workspace = true
image.workspace = true
tokio = { workspace = true, features = ["rt"] }
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["fs"] }

[lints]
workspace = true

[lib]
test = false
doctest = false
bench = false
