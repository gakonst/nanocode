[package]
name = "nanocode-database"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Lock keys, wake-ups, session locks, reentrancy guards and lanes for a database several processes share"
autotests = false
autobenches = false

[dependencies]
futures-util.workspace = true
nanocode-sync.workspace = true
