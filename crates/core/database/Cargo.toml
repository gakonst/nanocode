tokio = { workspace = true, features = ["sync"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { workspace = true, features = ["rt", "sync", "time"] }

[lints]
workspace = true

[lib]
test = false
doctest = false
bench = false
