[package]
autotests = false
autobenches = false
name = "nanocode-tls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared cached native TLS configuration"
[target.'cfg(not(target_family = "wasm"))'.dependencies]
nanocode-sync.workspace = true
rustls = { workspace = true, features = ["std"] }
rustls-graviola.workspace = true
tokio = { workspace = true, features = ["rt"] }
tracing.workspace = true
[target.'cfg(all(not(target_family = "wasm"), not(target_os = "macos")))'.dependencies]
nanocode-platform.workspace = true
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
rustls-platform-verifier = "0.7.0"
[lints]
workspace = true

[lib]
test = false
doctest = false
bench = false
