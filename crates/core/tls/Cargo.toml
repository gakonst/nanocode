[package]
autotests = false
autobenches = false
name = "nanocode-tls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared cached native TLS configuration"
[target.'cfg(not(target_family = "wasm"))'.dependencies]
arc-swap.workspace = true
nanocode-sync.workspace = true
rustls = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["rt", "sync"] }
tracing.workspace = true
[target.'cfg(all(not(target_family = "wasm"), not(target_os = "macos")))'.dependencies]
rustls-native-certs.workspace = true
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
rustls-platform-verifier = "0.7.0"
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
rustls-graviola = "0.4.0"
[target.'cfg(all(not(target_family = "wasm"), not(all(target_os = "macos", target_arch = "aarch64"))))'.dependencies]
rustls = { workspace = true, features = ["ring"] }
[lints]
workspace = true

[lib]
test = false
doctest = false
bench = false
