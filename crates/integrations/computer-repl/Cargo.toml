[package]
autotests = false
autobenches = false
name = "nanocode-computer-repl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The Sky-compatible cua_repl tools over an MCP computer provider, and the browser extension host"
include = ["src/**", "Cargo.toml"]

[target.'cfg(not(target_family = "wasm"))'.dependencies]
async-trait.workspace = true
base64.workspace = true
base64-simd.workspace = true
nanocode-sync.workspace = true
nanocode-tool-contracts.workspace = true
nanocode-types.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "sync", "time"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
missing_const_for_fn = "warn"
use_self = "warn"
double_must_use = "allow"
redundant_clone = "warn"
large_enum_variant = "allow"
result_large_err = "allow"

[lib]
test = false
doctest = false
bench = false
