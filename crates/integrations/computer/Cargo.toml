[package]
autotests = false
autobenches = false
name = "nanocode-computer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Computer use for agents: one computer tool over macOS accessibility, Linux AT-SPI, cua-driver and MCP providers, plus the Sky-compatible cua_repl tools and browser extension host"
include = ["src/**", "Cargo.toml"]

[target.'cfg(not(target_family = "wasm"))'.dependencies]
nanocode-computer-repl.workspace = true
nanocode-mcp.workspace = true
nanocode-mcp-tools.workspace = true
nanocode-platform.workspace = true
nanocode-sync.workspace = true
nanocode-sys.workspace = true
nanocode-tool-contracts.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "process", "rt", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true
nanocode-sys.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nanocode-jpeg.workspace = true
nanocode-sys.workspace = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
missing_const_for_fn = "warn"
use_self = "warn"
double_must_use = "allow"
redundant_clone = "warn"
large_enum_variant = "allow"
result_large_err = "allow"

[lib]
test = false
doctest = false
bench = false
