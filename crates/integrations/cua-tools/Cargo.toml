[package]
autotests = false
autobenches = false
name = "nanocode-cua-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Computer-use tools over an MCP computer provider, and the browser extension host"
include = ["src/**", "Cargo.toml"]

[target.'cfg(not(target_family = "wasm"))'.dependencies]
nanocode-tool-contracts.workspace = true
nanocode-sync.workspace = true
async-trait.workspace = true
base64.workspace = true
base64-simd.workspace = true
nanocode-types.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "sync", "time"] }

[lib]
test = false
doctest = false
bench = false
