[package]
autotests = false
autobenches = false
name = "nanocode-cua"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Thin MCP transport for the official external Sky computer provider"
include = ["src/**", "Cargo.toml"]

[target.'cfg(not(target_family = "wasm"))'.dependencies]
nanocode-tool-contracts.workspace = true
nanocode-mcp.workspace = true
nanocode-mcp-tools.workspace = true
nanocode-sync.workspace = true
async-trait.workspace = true
base64.workspace = true
base64-simd.workspace = true
nanocode-types.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
cua-driver-core.workspace = true
cua-driver-sdk.workspace = true
cursor-overlay.workspace = true


[lib]
test = false
doctest = false
bench = false
