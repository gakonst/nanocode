[package]
autotests = false
autobenches = false
name = "nanocode-database-postgres"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "PostgreSQL for nanocode-database: lock-taking BEGINs, pipelined locked writes, LISTEN and forwarded NOTIFY"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
futures-util.workspace = true
nanocode-database.workspace = true
nanocode-sync.workspace = true
percent-encoding = "2"
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "rt", "sync", "time"] }
tokio-postgres.workspace = true
tokio-postgres-rustls = "0.13"
webpki-roots = "1"

[lints]
workspace = true

[lib]
test = false
doctest = false
bench = false
