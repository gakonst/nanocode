nanocode-platform.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "process", "rt", "signal", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true
nanocode-sys.workspace = true

[lints]
workspace = true

[lib]
test = false
doctest = false
bench = false
