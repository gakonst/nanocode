[package]
name = "nanocode-process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
autotests = false
autobenches = false
description = "Reusable native process and PTY execution"

[dependencies]
nanocode-process-contracts.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
nanocode-home.workspace = true
nanocode-psh.workspace = true
nanocode-sync.workspace = true
portable-pty.workspace = true
tracing.workspace = true
getrandom.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["event", "fs"] }
rustix = { workspace = true, features = ["fs", "process", "pty"] }

[lints]
workspace = true

[lib]
test = false
doctest = false
bench = false
