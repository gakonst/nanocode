[package]
autotests = false
autobenches = false
name = "nanocode-sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords = ["ai", "agents", "sandbox", "landlock", "bubblewrap"]
categories.workspace = true
description = "Run a command confined to read-only paths, one writable directory and an allowlisted egress proxy (Landlock confinement on Linux only)"
include = ["src/**", "Cargo.toml"]

[target.'cfg(unix)'.dependencies]
nanocode-sync.workspace = true
rcgen.workspace = true
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
rustls-native-certs.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt", "time"] }
tokio-rustls = { workspace = true, features = ["ring", "tls12"] }

[target.'cfg(target_os = "linux")'.dependencies]
landlock.workspace = true
libc.workspace = true
rustix = { workspace = true, features = ["fs", "process", "std"] }
seccompiler.workspace = true

[lints]
workspace = true

[lib]
test = false
doctest = false
bench = false
