[package]
autotests = false
autobenches = false
name = "nanocode-sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["ai", "agents", "sandbox", "landlock", "bubblewrap"]
categories.workspace = true
description = "Run a command confined to read-only paths, one writable directory and an allowlisted egress proxy (Landlock confinement on Linux only)"
include = ["src/**", "Cargo.toml"]

[target.'cfg(unix)'.dependencies]
base64.workspace = true
bytes.workspace = true
futures-util.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1", "server"] }
hyper-util = { workspace = true, features = ["tokio"] }
nanocode-sync.workspace = true
nanocode-x509.workspace = true
ring.workspace = true
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7.0"
libc.workspace = true
nanocode-sys.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-rustls = { workspace = true, features = ["ring", "tls12"] }
tracing.workspace = true
nanocode-platform.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
serde_json.workspace = true

[lints]
workspace = true

[lib]
test = false
doctest = false
bench = false
