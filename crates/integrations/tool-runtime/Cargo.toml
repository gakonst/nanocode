[package]
name = "nanocode-tool-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "Host tool registration, workspace execution, MCP and remote adapters"
autotests = false
autobenches = false

[dependencies]
nanocode-tool-host.workspace = true
nanocode-tool-provider.workspace = true
nanocode-code-mode.workspace = true
nanocode-tools.workspace = true
nanocode-types.workspace = true
nanocode-home.workspace = true
nanocode-media.workspace = true
nanocode-sync.workspace = true
nanocode-mcp-tools.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
nanocode-process.workspace = true
async-trait.workspace = true
futures-util.workspace = true
getrandom.workspace = true
http.workspace = true
httpdate.workspace = true
nanocode-tls.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tokio-util.workspace = true
tokio-tungstenite.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["v4"] }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["hostname"] }

[lints]
workspace = true

[lib]
test = false
doctest = false
bench = false
