[package]
name = "nanocode-tool-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "Host tool registration, workspace execution, MCP and remote adapters"
autotests = false
autobenches = false

[dependencies]
nanocode-sys.workspace = true
nanocode-tool-host.workspace = true
nanocode-tool-provider.workspace = true
nanocode-code-mode.workspace = true
nanocode-tools.workspace = true
nanocode-home.workspace = true
nanocode-sync.workspace = true
nanocode-mcp-tools.workspace = true
serde.workspace = true
serde_json.workspace = true
nanocode-trace.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
nanocode-process.workspace = true
http.workspace = true
nanocode-tls.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "net", "rt", "signal", "sync", "time"] }
nanocode-websocket.workspace = true
nanocode-url.workspace = true
nanocode-platform.workspace = true

[target.'cfg(unix)'.dependencies]
nanocode-platform.workspace = true

[lints]
workspace = true

[lib]
test = false
doctest = false
bench = false
