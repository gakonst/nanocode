[package]
autotests = false
autobenches = false
name = "nanocode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Public composition and builders for the Nanocode Rust agent crates"

[package.metadata.docs.rs]
rustdoc-args = ["-D", "warnings"]

[dependencies]
nanocode-tool-runtime.workspace = true
nanocode-platform.workspace = true
nanocode-process-contracts.workspace = true
nanocode-agent.workspace = true
nanocode-agent-host.workspace = true
nanocode-backend-codex.workspace = true
nanocode-tools.workspace = true
nanocode-backend-claude = { workspace = true }
nanocode-durability = { workspace = true   }
nanocode-subagents.workspace = true
nanocode-turnlog.workspace = true
nanocode-code-mode = { path = "../runtime/code-mode", version = "0.7.0"   }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
nanocode-computer = { workspace = true, optional = true }
nanocode-store-jsonl.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
serde_json.workspace = true
nanocode-home.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
libc.workspace = true

[features]
default = ["local-cells", "cua"]
# Computer use: re-exports nanocode-computer and lets agents use it.
cua = ["dep:nanocode-computer", "nanocode-agent-host/cua"]
local-cells = ["nanocode-code-mode/local-cells"]

[lints]
workspace = true

[lib]
test = false
doctest = false
bench = false
