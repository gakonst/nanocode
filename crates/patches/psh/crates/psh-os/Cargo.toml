[package]
name = "psh-os"
description = "The psh OS hosts: processes, pipes and files of the real system (ARCH.md \"psh-os\")"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

# psh-engine for the Host trait; nanocode-sys's C library declarations on Unix and
# its Win32 declarations on Windows (D024).
[dependencies]
psh-engine.workspace = true

[target.'cfg(unix)'.dependencies]
nanocode-sys.workspace = true

[target.'cfg(windows)'.dependencies.windows-sys]
package = "nanocode-windows-sys"
path = "../../../../core/windows-sys"

# The one crate allowed `unsafe` (AGENTS.md): every block says why it is sound.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
