[package]
name = "psh-utils"
description = "psh's in-process utilities (ARCH.md \"psh-utils\")"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The utility API (psh_engine::util, D1081).
psh-engine.workspace = true
# The per-utility option tables the utilities check their parsers against (D1090).
psh-classify.workspace = true
# POSIX patterns: the parser behind the BRE/ERE translator and the leftmost-longest,
# back-reference matcher where psh-pattern cannot answer (D1131).
psh-regex.workspace = true
psh-pattern.workspace = true
# Byte and substring searches of the record readers.
memchr = "2.8.3"
nanocode-sys.workspace = true

[lints]
workspace = true
