[package]
edition = "2021"
rust-version = "1.85"
name = "rustls-platform-verifier"
version = "0.7.0"
description = "rustls-platform-verifier supports verifying TLS certificates in rustls with the operating system verifier"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rustls/rustls-platform-verifier"
publish = false

[features]
docsrs = []

[lib]
name = "rustls_platform_verifier"
path = "src/lib.rs"

[dependencies]
rustls = { version = "0.23.27", default-features = false, features = ["std"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }

[target.'cfg(all(unix, not(target_vendor = "apple"), not(target_arch = "wasm32")))'.dependencies]
nanocode-platform = { path = "../../core/platform" }
nanocode-sys = { path = "../../core/sys" }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false }
webpki-root-certs = "1"

[target.'cfg(all(target_vendor = "apple", not(target_os = "macos")))'.dependencies]
nanocode-sys = { path = "../../core/sys" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
nanocode-sys = { path = "../../core/sys" }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false }
webpki-root-certs = "1"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", default-features = false, features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
