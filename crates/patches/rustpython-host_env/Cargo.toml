[package]
edition = "2024"
rust-version = "1.95.0"
name = "rustpython-host_env"
version = "0.6.0"
authors = ["RustPython Team"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Host OS API abstractions for RustPython"
readme = false
license = "MIT"
repository = "https://github.com/RustPython/RustPython"
resolver = "2"

[features]
ctypes = [
    "dep:libffi",
    "dep:libloading",
]
native-certs = ["dep:rustls-native-certs"]
rustls = [
    "ssl",
    "dep:rustls",
    "dep:rustls-pemfile",
    "dep:rustls-webpki",
    "dep:x509-parser",
    "dep:der",
    "dep:pkcs8",
    "dep:sha2",
]
ssl = []

[lib]
name = "rustpython_host_env"
path = "src/lib.rs"

[dependencies.der]
version = "0.8"
features = [
    "alloc",
    "oid",
    "pem",
    "zeroize",
]
optional = true

[dependencies.nanocode-platform]
path = "../../core/platform"

[dependencies.libc]
version = "0.2.186"

[dependencies.pkcs8]
version = "0.11"
features = [
    "encryption",
    "pkcs5",
    "pem",
]
optional = true

[dependencies.rustls]
version = "0.23.39"
features = [
    "std",
    "tls12",
]
optional = true
default-features = false

[dependencies.rustls-pemfile]
version = "2.2"
optional = true

[dependencies.rustls-webpki]
version = "0.103"
features = ["std"]
optional = true
default-features = false

[dependencies.rustpython-wtf8]
version = "0.6.0"

[dependencies.sha2]
version = "0.11"
optional = true

[dependencies.x509-parser]
version = "0.18"
optional = true

[target.'cfg(all(any(target_os = "linux", target_os = "macos", target_os = "windows", target_os = "android"), not(any(target_env = "musl", target_env = "sgx"))))'.dependencies.libffi]
version = "5"
features = ["system"]
optional = true

[target."cfg(any(unix, windows))".dependencies.libloading]
version = "0.9"
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.rustls-native-certs]
version = "0.8"
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies.rustls]
version = "0.23.39"
