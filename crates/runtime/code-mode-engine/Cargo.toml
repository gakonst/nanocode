[package]
name = "nanocode-code-mode-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "QuickJS execution worker for Code Mode on native and WASM hosts"
autotests = false
autobenches = false

[dependencies]
nanocode-platform.workspace = true
nanocode-sync.workspace = true
nanocode-tool-contracts.workspace = true
base64.workspace = true
base64-simd.workspace = true
rquickjs.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { workspace = true, features = ["rt", "sync"] }

[target.'cfg(target_family = "wasm")'.dependencies]
rquickjs = { workspace = true, features = ["bindgen"] }
tokio = { workspace = true, features = ["macros", "sync"] }

[lints]
workspace = true

[lib]
test = false
doctest = false
bench = false
