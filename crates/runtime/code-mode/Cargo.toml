[package]
autotests = false
autobenches = false
name = "nanocode-code-mode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Backend-generic Code Mode execution and host contracts"

[package.metadata.docs.rs]
rustdoc-args = ["-D", "warnings"]

[dependencies]
blake3.workspace = true
nanocode-types-core.workspace = true
nanocode-media = { path = "../../core/media", version = "0.6.7" }
nanocode-platform.workspace = true
nanocode-sync.workspace = true
nanocode-tool-contracts.workspace = true
nanocode-tools.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
nanocode-code-mode-engine.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }

[target.'cfg(target_family = "wasm")'.dependencies]
nanocode-code-mode-engine = { workspace = true, optional = true }
tokio = { workspace = true, features = ["macros", "sync"] }

[features]
local-cells = ["dep:nanocode-code-mode-engine"]

[lints]
workspace = true

[lib]
test = false
doctest = false
bench = false
