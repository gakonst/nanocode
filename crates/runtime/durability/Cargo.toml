[package]
autotests = false
autobenches = false
name = "nanocode-durability"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Portable durable execution state and stores for Nanocode"

[package.metadata.docs.rs]
rustdoc-args = ["-D", "warnings"]

[dependencies]
nanocode-durability-core.workspace = true
nanocode-platform.workspace = true
nanocode-sync.workspace = true
nanocode-agent-core.workspace = true
serde.workspace = true
serde_json.workspace = true
nanocode-trace.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { workspace = true, features = ["rt"] }

[lints]
workspace = true

[lib]
test = false
doctest = false
bench = false
