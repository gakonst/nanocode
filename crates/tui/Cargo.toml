[package]
name = "nanocode-tui"
autotests = false
autobenches = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
authors = ["Nanocode Contributors", "Ben Clabby"]
license = "Apache-2.0"
repository.workspace = true
description = "Terminal UI components for Nanocode hosts, derived from clabby/tact"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
pulldown-cmark = { version = "0.13.0", default-features = false }
serde.workspace = true
arc-swap.workspace = true
memchr.workspace = true
nanocode-sync.workspace = true
rustix = { workspace = true, features = ["event", "termios"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "regex-onig"] }
tokio = { workspace = true, features = ["net", "signal"] }
tracing.workspace = true
unicode-segmentation = "1.13"
unicode-width = "0.2"

[lints]
workspace = true

[lib]
test = false
doctest = false
bench = false
